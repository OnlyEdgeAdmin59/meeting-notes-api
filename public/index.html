<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteMeeting</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-2xl">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-purple-700 mb-2">NoteMeeting</h1>
                <p class="text-gray-600" data-i18n="tagline">Turn meetings into tasks that actually get done</p>
            </div>
            <div class="bg-white rounded-lg shadow-lg p-8">
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2" for="apiKey" data-i18n="apiKey">API Key</label>
                    <input type="password" id="apiKey" autocomplete="off" class="w-full px-4 py-2 border border-gray-300 rounded-lg" />
                    <p id="usage" class="text-xs text-gray-500 mt-2"></p>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2" for="webhookUrl" data-i18n="webhook">Slack Webhook URL (optional)</label>
                    <input type="text" id="webhookUrl" placeholder="https://hooks.slack.com/services/..." class="w-full px-4 py-2 border border-gray-300 rounded-lg" />
                    <p class="text-xs text-gray-500 mt-2" data-i18n="webhookHelp">Leave empty to use the channel saved on your account.</p>
                </div>
                <button id="testBtn" class="w-full mb-6 bg-green-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-green-700 transition" data-i18n="test">Test Slack connection</button>
                <div class="border-t border-gray-200 my-6"></div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-2" for="file" data-i18n="file">Upload transcript (Zoom, Meet, Teams: .vtt, .srt, .txt)</label>
                    <input type="file" id="file" accept=".vtt,.srt,.txt" class="w-full text-sm" />
                </div>
                <p class="text-center text-sm text-gray-500 mb-4" data-i18n="or">or paste it</p>
                <div class="mb-6">
                    <textarea id="transcript" rows="8" class="w-full px-4 py-2 border border-gray-300 rounded-lg font-mono text-sm" placeholder="Ana: Let's ship the dashboard by Friday. Bob: I'll handle the backend."></textarea>
                </div>
                <button id="extractBtn" class="w-full bg-purple-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-purple-700 transition" data-i18n="extract">Extract &amp; send to Slack</button>
                <div id="status" class="mt-6 hidden p-4 rounded-lg"></div>
                <div id="results" class="mt-6 hidden bg-gray-50 p-4 rounded-lg">
                    <p class="text-sm text-blue-900 mb-4"><strong data-i18n="summary">Summary</strong>: <span id="summary"></span></p>
                    <div id="decisions"></div>
                    <h3 class="font-semibold text-gray-900 mb-3" data-i18n="tasks">Action items</h3>
                    <div id="actionItems"></div>
                </div>
            </div>
            <p class="text-center text-xs text-gray-500 mt-8">NoteMeeting · Vanguard Growth LLC</p>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
