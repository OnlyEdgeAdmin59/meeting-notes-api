<!DOCTYPE html>
<html>
<head>
    <title>Meeting Notes Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="max-w-2xl mx-auto p-8">
        <h1 class="text-4xl font-bold text-center text-blue-600 mb-2">Meeting Notes Extractor</h1>
        <p class="text-center text-gray-600 mb-8">Extract action items and send to Slack</p>
        
        <form onsubmit="handleSubmit(event)" class="bg-white rounded-lg shadow p-8">
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">Slack Webhook URL</label>
                <input type="text" name="webhook_url" placeholder="https://hooks.slack.com/services/..." class="w-full border border-gray-300 rounded px-4 py-2">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">Meeting Transcript</label>
                <textarea name="transcript" placeholder="Alice: We need to ship..." class="w-full border border-gray-300 rounded px-4 py-2 h-32" required></textarea>
            </div>

            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded mb-6">🎯 Extract & Send to Slack</button>

            <div id="result" class="mt-6"></div>
        </form>
    </div>

    <script>
        async function handleSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p class="text-blue-600">Processing...</p>';

            try {
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    let html = '<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded"><p class="font-bold mb-2">✅ Success!</p><p><strong>Summary:</strong> ' + data.summary + '</p><ul class="list-disc pl-5 mt-2">';
                    data.action_items.forEach(item => {
                        html += '<li>' + item.task + ' (Owner: ' + item.owner + ', Due: ' + item.deadline + ')</li>';
                    });
                    html += '</ul></div>';
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = '<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">❌ Error: ' + data.error + '</div>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">❌ Error: ' + error.message + '</div>';
            }
        }
    </script>
</body>
</html>
