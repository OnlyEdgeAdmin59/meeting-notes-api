<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Notes Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="max-w-2xl mx-auto p-8">
        <h1 class="text-4xl font-bold text-center text-blue-600 mb-2">Meeting Notes Extractor</h1>
        <p class="text-center text-gray-600 mb-8">Extract action items and send to Slack instantly</p>
        
        <div class="bg-white rounded-lg shadow p-8">
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">Slack Webhook URL</label>
                <input type="text" id="webhookUrl" placeholder="https://hooks.slack.com/services/..." class="w-full border border-gray-300 rounded px-4 py-2">
                <p class="text-sm text-gray-500 mt-1">Optional - uses server default if blank</p>
            </div>

            <button onclick="testWebhook()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded mb-6">🧪 Test Slack Webhook</button>

            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">Meeting Transcript</label>
                <textarea id="transcript" placeholder="Alice: We need to ship the dashboard by Friday..." class="w-full border border-gray-300 rounded px-4 py-2 h-32"></textarea>
            </div>

            <button onclick="extractAndSend()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded mb-6">🎯 Extract & Send to Slack</button>

            <div id="result" class="mt-6"></div>
        </div>
    </div>

    <script>
        async function testWebhook() {
            const webhookUrl = document.getElementById('webhookUrl').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p class="text-blue-600">Testing...</p>';

            try {
                const response = await fetch('/api/test', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `webhook_url=${encodeURIComponent(webhookUrl)}`
                });
                const data = await response.json();
                if (data.success) {
                    resultDiv.innerHTML = '<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">✅ Webhook test successful!</div>';
                } else {
                    resultDiv.innerHTML = `<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">❌ Error: ${data.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">❌ Error: ${error.message}</div>`;
            }
        }

        async function extractAndSend() {
            const webhookUrl = document.getElementById('webhookUrl').value;
            const transcript = document.getElementById('transcript').value;
            const resultDiv = document.getElementById('result');
            
            if (!transcript.trim()) {
                resultDiv.innerHTML = '<div class="bg-yellow-100 border border-yellow-400 text-yellow-700 px-4 py-3 rounded">⚠️ Please enter a meeting transcript</div>';
                return;
            }

            resultDiv.innerHTML = '<p class="text-blue-600">Processing...</p>';

            try {
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `transcript=${encodeURIComponent(transcript)}&webhook_url=${encodeURIComponent(webhookUrl)}`
                });
                const data = await response.json();
                
                if (data.success) {
                    let html = `<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                        <p class="font-bold mb-2">✅ Success! Extracted:</p>
                        <p class="mb-2"><strong>Summary:</strong> ${data.summary}</p>
                        <p class="font-bold mb-2">Action Items:</p>
                        <ul class="list-disc pl-5">`;
                    data.action_items.forEach(item => {
                        html += `<li>${item.task} (Owner: ${item.owner}, Due: ${item.deadline})</li>`;
                    });
                    html += `</ul>
                        <p class="text-sm mt-2">Slack status: ${data.slack_sent ? '✅ Sent' : '❌ Failed'}</p>
                    </div>`;
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">❌ Error: ${data.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">❌ Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
